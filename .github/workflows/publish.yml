name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  commit-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages (Conventional Commits)
        run: |
          regex='^(feat|fix|docs|style|refactor|test|chore|ci|build|perf)(\(.+\))?: .+'
          commits=$(git log origin/master..HEAD --pretty=format:%s || git log -n 1 --pretty=format:%s)

          for commit in $commits; do
            if ! [[ "$commit" =~ $regex ]]; then
              echo "❌ Invalid commit message:"
              echo "$commit"
              exit 1
            fi
          done

  format:
    runs-on: ubuntu-latest
    needs: commit-style

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Format code
        run: ruff format .

      - name: Create formatting PR if needed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "style: auto format with ruff"
          title: "style: auto format"
          branch: ci/auto-format
          body: |
            Automated formatting using Ruff.

  test:
    runs-on: ubuntu-latest
    needs: format
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
