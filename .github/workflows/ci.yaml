name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  commit-style:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory /__w/adaptive-executor/adaptive-executor

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Validate commit messages
        run: npx commitlint --from origin/master --to HEAD --verbose

  auto-format:
    runs-on: ubuntu-latest
    needs: commit-style
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff fix and commit back to branch
        run: |
          ruff check --fix .
          ruff format .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "style: auto-fix ruff formatting" && git push)

  test:
    runs-on: ubuntu-latest
    needs: auto-format
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: |
          pytest --cov=adaptive_executor --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Commit test status badge
        if: matrix.python-version == '3.11'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .badges
          echo "passed" > .badges/tests-passed
          git add .badges/tests-passed
          git diff --staged --quiet || (git commit -m "ci: update test status badge" && git push)

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Amend CI commit with build changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            if git log -1 --format='%ae' | grep -q 'github-actions\[bot\]'; then
              git commit --amend --no-edit
            else
              git commit -m "chore: ci build changes"
            fi
            git push --force-with-lease
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  open-pr:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Open PR to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "PR: ${{ github.ref_name }}" \
            --body "Automated PR for branch ${{ github.ref_name }}" \
            --base master \
            --head "${{ github.ref_name }}" \
            || true

      - name: Commit PR marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          echo "${{ github.ref_name }} $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .github/pr-opened
          git add .github/pr-opened
          git diff --staged --quiet || (git commit -m "ci: mark PR opened for ${{ github.ref_name }}" && git push)
      
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR_COMMIT=$(git log --format='%H %ae' | grep -v 'github-actions\[bot\]' | head -1 | awk '{print $1}')
          gh pr merge "${{ github.ref_name }}" \
            --squash \
            --subject "$(git log -1 --format='%s' $AUTHOR_COMMIT)" \
            --body "$(git log -1 --format='%b' $AUTHOR_COMMIT)" \
            --delete-branch \
            || true