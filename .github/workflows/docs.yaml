name: Docs

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Better for versioning tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz psutil
          pip install -e .
          pip install sphinx pydata-sphinx-theme myst-parser

      - name: Generate switcher.json
        run: |
          VERSION_SHORT=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); v=d['project']['version']; print('.'.join(v.split('.')[:2]))")
          mkdir -p docs/_static
          cat > docs/_static/switcher.json << EOF
          [{"name": "$VERSION_SHORT (latest)", "version": "$VERSION_SHORT", "url": "/"}]
          EOF

      - name: Build docs
        run: sphinx-build -E -b html docs/ docs/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html