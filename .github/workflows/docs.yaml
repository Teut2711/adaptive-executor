name: Docs

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Better for versioning tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install your package + dependencies + docs tools
          pip install pytz psutil  # Explicitly add pytz to stop the crash
          pip install -e .
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Build docs
        run: |
          # The -E forces a fresh environment, -W turns warnings into errors
          # This helps catch the "masterindex.rst" bug before it deploys
          sphinx-build -E -b html docs/ docs/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html